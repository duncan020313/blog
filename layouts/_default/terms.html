{{ define "main" }}
<div class="content-section">
  <header class="section-header">
    <h1>{{ .Title | default "Tags" }}</h1>
  </header>
  <div class="term-list">
    {{- range .Data.Terms.ByCount }}
    <a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span>{{ .Count }}</span></a>
    {{- end }}
  </div>
</div>
{{ end }}
