<footer class="site-footer">
  <div class="site-footer-inner wrap">
    <div class="footer-links">
      {{- range $key := .Site.Params.Social }}
      <a href="{{ $key.url }}" rel="me" title="{{ $key.name }}">{{ $key.name }}</a>
      {{- end }}
    </div>
    <p class="footer-info">&copy; {{ dateFormat "2006" now }}{{ with .Site.Copyright }} {{ . }}{{ end }}</p>
  </div>
</footer>
